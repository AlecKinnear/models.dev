# Sources:
# - https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-argon
# Global-endpoint Standard pricing. Promotional pricing through 2026-11-30 is
# delivered as 50% credits back on net spend; from 2026-12-01 the published
# global rates are $4.00 input, $20.00 output, and $0.20 cache read.
# Non-global (us, eu) endpoints cost 10% more: $2.20 input, $11.00 output,
# and $0.11 cache read during the promotion, then $4.40 / $22.00 / $0.22.
# v2 capabilities and prices:
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/context-cache/context-cache-overview
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/thinking
# - https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/priority-paygo
# Non-global (regional and us/eu multi-region) endpoints cost 10% more than global.
# Introductory pricing ends 2026-12-01; token prices then double.
# Mid-conversation updates: false. Vertex takes system instructions, thinking config and tools only as request-level
# fields (systemInstruction, generationConfig.thinkingConfig, tools; Content.role is user or model): https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/prompts/system-instruction-introduction
schema = 2
base_model = "google/gemini-4-argon"

[capabilities]
tools = { supported = true, updates = false }
reasoning = { supported = true, default = { type = "effort", value = "medium" }, effort = ["low", "medium", "high"] }
system_updates = false
effort_updates = false
cache = { supported = true, implicit = { min_tokens = 4_096 } }
service_tier = ["priority"]

[cost.text.input]
price = 2
cache = { read = 0.1 }

[cost.text.output]
price = 10

[cost.audio.input]
price = 2
cache = { read = 0.1 }

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = 1.8

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = 1.1

[[cost.multipliers]]
when = { date = { gte = "2026-12-01" } }
factor = 2
