# Sources:
# https://developers.openai.com/api/docs/models/chat-latest
# https://developers.openai.com/api/docs/pricing
schema = 2
base_model = "openai/gpt-5.5-instant"
name = "Chat Latest"
knowledge = "2026-04-20"

[capabilities]
reasoning = { supported = true, effort = ["medium"] }
structured_output = true
temperature = false
top_p = false
system_updates = true
effort_updates = false
store = true
cache = { supported = true, implicit = { min_tokens = 1_024 }, explicit = false }
prompt_cache_key = true

[cost.text.input]
price = 5
cache = { read = 0.5 }

[cost.text.output]
price = 30
