# Sources:
# https://developers.openai.com/api/docs/models/gpt-realtime-mini
# https://developers.openai.com/api/docs/changelog
schema = 2
v2_only = true
type = "realtime"
name = "GPT-Realtime Mini"
description = "Cost-efficient realtime speech-to-speech model for voice agents"
family = "gpt-mini"
open_weights = false
knowledge = "2023-10-01"
release_date = "2025-10-06"

[modalities]
input = ["text", "audio", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text", "audio"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 32_000
output = 4_096
