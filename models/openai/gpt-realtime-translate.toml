# Sources:
# https://developers.openai.com/api/docs/models/gpt-realtime-translate
# https://developers.openai.com/api/docs/changelog
schema = 2
v2_only = true
type = "realtime"
name = "GPT-Realtime-Translate"
description = "Streaming speech-to-speech translation model for live multilingual audio"
family = "gpt"
open_weights = false
knowledge = "2024-09-30"
release_date = "2026-05-07"

[modalities]
input = ["audio"]
output = ["text", "audio"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 16_000
output = 2_000
