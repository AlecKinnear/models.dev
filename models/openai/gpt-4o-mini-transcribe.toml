# Sources:
# https://developers.openai.com/api/docs/models/gpt-4o-mini-transcribe
# https://developers.openai.com/api/docs/changelog
schema = 2
v2_only = true
type = "transcription"
name = "GPT-4o Mini Transcribe"
description = "Speech-to-text model powered by GPT-4o Mini for fast, accurate transcription"
family = "gpt-mini"
open_weights = false
knowledge = "2024-06-01"
release_date = "2025-03-20"

[modalities]
input = ["text", "audio"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = false
top_k = false

[limit]
context = 16_000
output = 2_000
