# Sources:
# https://developers.openai.com/api/docs/models/gpt-audio-1.5
# https://developers.openai.com/api/docs/changelog
schema = 2
v2_only = true
type = "chat"
name = "GPT-Audio-1.5"
description = "Audio model for speech input and output with the Chat Completions API"
family = "gpt"
open_weights = false
knowledge = "2024-09-30"
release_date = "2026-02-23"

[modalities]
input = ["text", "audio"]
output = ["text", "audio"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 16_384
