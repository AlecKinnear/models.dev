schema = 2
type = "transcription"
name = "GPT-Transcribe"
description = "High-accuracy speech-to-text model for audio files and committed Realtime turns"
family = "gpt"
open_weights = false
release_date = "2026-07-28"

[modalities]
input = ["text", "audio"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
top_p = false
top_k = false

[limit]
context = 0
output = 0
